[project]
name = "candela-lab"
version = "0.1.0"
description = "Candela Lab: data, training, evaluation, export and publishing for the Candela models"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "mlx==0.32.4",
  "mlx-lm==0.32.2",
  "transformers==5.20.2",
  "datasets==5.1.0",
  "huggingface_hub==2.2.0",
  "tokenizers==0.23.3",
  "sentencepiece==0.2.2",
  "gguf==0.19.0",
  "numpy==2.5.4",
  "pandas==3.1.0",
  "scikit-learn==1.9.1",
  "typer>=0.20",
  "psutil>=7.1",
  "pyyaml>=6.0.3",
  "httpx>=0.28",
  "jinja2>=3.1.6",
  "rich>=14",
]

[dependency-groups]
dev = ["ruff>=0.14", "pyright>=1.1.407", "types-pyyaml", "types-psutil"]

[project.scripts]
lab = "candela_lab.cli:app"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "PLR0913", "PLR0917", "PLW0603", "PLR2004", "PLR0912", "PLR0915", "PLR0911", "PLC0415"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false
