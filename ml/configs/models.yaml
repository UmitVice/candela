# Candela Pro base model. Read by `candela_lab` (training, evaluation, export) and by `services/worker` (serving).
# Local paths point at the owner's existing files: strictly read-only, never moved, modified or deleted.
# `~` expands to the user's home; `env` names the variable that overrides `path`.
schema: 2
default: gemma-4-12b-qat

models:
  gemma-4-12b-qat:
    product: Candela Pro
    family: gemma4
    displayName: Gemma 4 12B (QAT int4)
    license: apache-2.0
    upstream:
      qatUnquantized: google/gemma-4-12B-it-qat-q4_0-unquantized
      qatGguf: google/gemma-4-12B-it-qat-q4_0-gguf
      instruct: google/gemma-4-12B-it
    base:
      format: mlx
      path: ~/models/gemma-4-12b-it-qat-mlx-q4
      env: CANDELA_PRO_BASE
      quantization: {mode: affine, bits: 4, groupSize: 32}
      sizeGb: 7.0
    reference:
      format: hf-bf16
      path: ~/models/gemma-4-12b-it-qat-unquantized
      env: CANDELA_PRO_REFERENCE
    gguf:
      path: ~/models/gemma-4-12b-it-qat/gemma-4-12B-it-qat-UD-Q4_K_XL.gguf
      env: CANDELA_PRO_GGUF
    contextLength: 262144
    trainContextLength: 2048
    architecture:
      modelType: gemma4_unified
      layers: 48
      hiddenSize: 3840
      intermediateSize: 15360
      attentionHeads: 16
      kvHeads: 8
      headDim: 256
      globalHeadDim: 512
      vocabSize: 262144
      slidingWindow: 1024
      tiedEmbeddings: true
      finalLogitSoftcap: 30.0
    chatTemplate:
      toolCallFormat: gemma4
      toolCallStart: "<|tool_call>"
      toolCallEnd: "<tool_call|>"
      toolCallSyntax: 'call:NAME{key:<|"|>string<|"|>,n:1}'
      toolResponse: "rendered inside the model turn as <|tool_response>response:NAME{value:<|\"|>...<|\"|>}<tool_response|>"
      toolArguments: mapping
      systemRole: true
      thinkingKwarg: enable_thinking
      thinking: "off by default; the non-thinking generation prompt appends an empty <|channel>thought<channel|> block"
      stop: ["<turn|>", "<|tool_response>"]
    lora:
      rank: 16
      scale: 2.0
      dropout: 0.05
      numLayers: 16
      keys: [self_attn.q_proj, self_attn.k_proj, self_attn.v_proj, self_attn.o_proj, mlp.gate_proj, mlp.up_proj, mlp.down_proj]
    memory: {trainBudgetGb: 10.5, inferenceBudgetGb: 8.0}
    adapters:
      merge: never
      serving: mlx
      portable: gguf-lora
