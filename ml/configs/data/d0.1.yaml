version: d0.1
seed: 20261023
validFraction: 0.04
maxTokens: 4096
tokenizerModel: gemma-4-12b-qat
today: "2026-10-22"

# Every download is pinned to a commit revision and verified against `sha256` (filled by `lab data fetch --pin`).
# Only parquet, JSON, JSONL, CSV and zip-of-JSON files are read; dataset scripts and pickles are never executed.

# Target number of supervised samples (one per assistant turn) per bucket. Buckets that cannot reach their
# target keep everything that survives the filters; the manifest records both numbers.
mix:
  candela_traces: 6000
  agentic_finance: 1500
  function_calling: 1000
  numeric_reasoning: 2500
  classic_sentiment: 400
  classic_headlines: 300
  general_retention: 1000

