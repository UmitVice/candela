[project]
name = "candela-worker"
version = "0.1.0"
description = "Candela Pro inference worker: MLX generation, worker protocol client and a local OpenAI-compatible API"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "mlx==0.32.4",
  "mlx-lm==0.32.2",
  "transformers==5.20.2",
  "tokenizers==0.23.3",
  "sentencepiece==0.2.2",
  "numpy==2.5.4",
  "fastapi==0.161.1",
  "uvicorn==0.54.0",
  "pydantic==2.14.1",
  "websockets==17.3",
  "typer==0.27.3",
  "psutil==7.2.2",
  "pyyaml==6.0.3",
]

[dependency-groups]
dev = ["ruff==0.17.2", "pyright==1.1.414", "pip-audit==2.10.1", "types-pyyaml", "types-psutil"]

[project.scripts]
candela-worker = "candela_worker.cli:app"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "PLR0913", "PLR0917", "PLW0603", "PLR2004", "PLR0912", "PLR0915", "PLR0911", "PLC0415"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false
