version: "2"
run:
  timeout: 5m
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - nilerr
    - unconvert
    - wastedassign
  settings:
    gosec:
      excludes:
        - G115
  exclusions:
    generated: strict
    presets:
      - std-error-handling
formatters:
  enable:
    - gofmt
